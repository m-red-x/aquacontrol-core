name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  purity:
    name: architecture purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: core/ and protocol/ must stay platform-free
        run: ./tools/check_purity.sh

  test:
    name: build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_BUILD_TYPE=Debug
          -DAQUA_SANITIZE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
